# RK3576 exposes both display and RKNPU DRM devices. Bind Xorg explicitly to
# the VOP2 display card so LightDM does not select the RKNPU GEM-only device.
Section "OutputClass"
    Identifier  "RockchipDRM"
    MatchDriver "rockchip"
    Option      "PrimaryGPU" "yes"
EndSection

Section "Device"
    Identifier  "Rockchip Graphics"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card0"

    # P2 uses software rendering until the Mali userspace stack is enabled.
    Option      "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier  "Default Screen"
    Device      "Rockchip Graphics"
EndSection
